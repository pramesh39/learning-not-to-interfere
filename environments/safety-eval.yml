# XSTest via safety-eval (third_party/safety-eval) with the WildGuard classifier.
# After creating: apply the patch and install, see README.
name: safety-eval
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.4.0
      - vllm==0.6.3
      - transformers==4.46.3
      - accelerate==1.14.0
      - datasets==5.0.1
      - safetensors==0.8.0
      - sentencepiece==0.2.2
      - numpy==1.26.4
      - pyyaml==6.0.3
